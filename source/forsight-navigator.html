<title>Форсайт-навигатор</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (nav) + scrolling main column; on phones the rail becomes a top strip of tabs.
   Three zones of the model carry their own hue; the accent is a horizon blue used for actions only. */
:root{
  --bg:#F1F4F8; --surface:#FFFFFF; --surface-2:#E8EDF3; --fg:#141B25; --muted:#5D6878; --line:#D3DAE4;
  --accent:#1B5F7E; --accent-ink:#0E3B50; --accent-soft:#DCEBF2; --on-accent:#FFFFFF;
  --z1:#4759A6; --z1-soft:#E5E8F6; --z2:#1E8A79; --z2-soft:#DDF1EC; --z3:#BD6E22; --z3-soft:#F7E9DA;
  --ok:#2E8B57; --warn:#C98A1B; --bad:#B9462E;
  --display:'Unbounded',system-ui,sans-serif; --body:'Golos Text',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --radius:10px; --shadow:0 1px 2px rgba(20,27,37,.06),0 6px 20px rgba(20,27,37,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#161D27; --surface-2:#1E2733; --fg:#E7EBF1; --muted:#9AA6B6; --line:#2B3542;
  --accent:#6FB8D6; --accent-ink:#BFE2F0; --accent-soft:#17344A; --on-accent:#0B1A24;
  --z1:#8E9BE0; --z1-soft:#232A4A; --z2:#5BC2AE; --z2-soft:#15362F; --z3:#E09A52; --z3-soft:#3B2A17;
  --ok:#5FBF8A; --warn:#E2AE4A; --bad:#E0735C; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D27; --surface-2:#1E2733; --fg:#E7EBF1; --muted:#9AA6B6; --line:#2B3542;
  --accent:#6FB8D6; --accent-ink:#BFE2F0; --accent-soft:#17344A; --on-accent:#0B1A24;
  --z1:#8E9BE0; --z1-soft:#232A4A; --z2:#5BC2AE; --z2-soft:#15362F; --z3:#E09A52; --z3-soft:#3B2A17;
  --ok:#5FBF8A; --warn:#E2AE4A; --bad:#E0735C; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--display);font-weight:500;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,3.2vw,2.5rem)}
h2{font-size:clamp(1.25rem,2.2vw,1.7rem)}
h3{font-size:1.05rem}
h4{font-size:.95rem;font-family:var(--body);font-weight:600}
p{margin:0}
.lead{font-size:1.08rem;color:var(--fg);max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.mono{font-family:var(--mono);font-size:.9em}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding-block:22px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:6px}
.brand .name{font-family:var(--display);font-size:1.05rem;font-weight:600;letter-spacing:-.01em}
.brand .sub{font-size:.8rem;color:var(--muted);line-height:1.35}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-size:.93rem;font-weight:500}
.nav a .ico{width:22px;height:22px;flex:none;color:var(--muted)}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.nav a[aria-current="page"] .ico{color:var(--accent)}
.nav .sep{height:1px;background:var(--line);margin:8px 10px}
.side .foot{margin-top:auto;font-size:.76rem;color:var(--muted);line-height:1.4}

.main{min-width:0;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.view-head{display:flex;flex-direction:column;gap:10px;max-width:70ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.card.flat{box-shadow:none}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-weight:500;font-size:.9rem;padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:focus-visible,.nav a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);letter-spacing:.01em}
.pill.z1{background:var(--z1-soft);color:var(--z1)}.pill.z2{background:var(--z2-soft);color:var(--z2)}.pill.z3{background:var(--z3-soft);color:var(--z3)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:.86rem;padding:7px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.z1[aria-pressed="true"]{background:var(--z1);border-color:var(--z1);color:#fff}
.chip.z2[aria-pressed="true"]{background:var(--z2);border-color:var(--z2);color:#fff}
.chip.z3[aria-pressed="true"]{background:var(--z3);border-color:var(--z3);color:#fff}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center}
.hero .copy{display:flex;flex-direction:column;gap:16px}
.hero .spiral{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.kpi{border-left:3px solid var(--accent);padding:4px 0 4px 12px}
.kpi b{font-family:var(--display);font-size:1.5rem;font-weight:500;display:block}
.kpi span{font-size:.82rem;color:var(--muted)}
.zone-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.86rem}
.zone-legend span{display:inline-flex;align-items:center;gap:7px}
.zone-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* spiral svg */
svg.sp{width:100%;height:auto;display:block}
svg.sp .node{cursor:pointer}
svg.sp .node circle{transition:r .15s ease}
svg.sp .node:hover circle.main{filter:brightness(1.1)}
svg.sp text{font-family:var(--body)}
svg.sp .lbl{font-size:12px;font-weight:600;fill:var(--fg)}
svg.sp .pos{font-size:10.5px;fill:var(--muted)}
svg.sp .center-t{font-family:var(--display);font-size:11px;fill:var(--fg);font-weight:500}
svg.sp .center-s{font-size:9.5px;fill:var(--muted)}
svg.sp .zone-t{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){ svg.sp .node circle.main{transition:r .15s ease,filter .15s ease} }

/* stage view */
.stage-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.stage-steps{display:grid;grid-template-columns:1fr;gap:0;counter-reset:st}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.step:first-child{border-top:0}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-weight:600;font-size:.85rem;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.step .t{font-weight:500}
.step .tools{font-size:.84rem;color:var(--muted);margin-top:2px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.check.done span{color:var(--muted);text-decoration:line-through}
.defl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;font-size:.93rem}
.defl dt{color:var(--muted)}
.defl dd{margin:0}
.progress{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s ease}
.stage-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:600px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0}

/* prompts */
.prompt{display:flex;flex-direction:column;gap:10px}
.prompt pre{margin:0;white-space:pre-wrap;font-family:var(--mono);font-size:.84rem;line-height:1.5;background:var(--surface-2);padding:14px;border-radius:8px;border:1px solid var(--line)}
.prompt pre b{color:var(--accent-ink);font-weight:600}

/* forms */
label.f{display:flex;flex-direction:column;gap:5px;font-size:.88rem;font-weight:500}
label.f .hint{font-weight:400;color:var(--muted);font-size:.82rem}
input[type=text],textarea,select{font:inherit;font-size:.95rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:84px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.quad{border:1px dashed var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.quad .qt{font-size:.8rem;font-weight:600;color:var(--muted)}

/* diagnostics */
.q{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:.92rem}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.result{border-left:4px solid var(--accent);padding:12px 16px;background:var(--accent-soft);border-radius:0 8px 8px 0;color:var(--fg)}
.scale{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:.82rem}
.scale div{padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.lvl-crit{border-top:3px solid var(--bad)}.lvl-adm{border-top:3px solid var(--warn)}.lvl-opt{border-top:3px solid var(--ok)}

/* chart */
.bars{display:grid;gap:14px}
.bar-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center}
.bar-row .lab{font-size:.9rem}
.bar-row .lab small{display:block;color:var(--muted);font-size:.78rem}
.track{display:flex;flex-direction:column;gap:4px}
.bar{height:16px;border-radius:4px;position:relative;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.bar.kg i{background:var(--muted)}.bar.eg i{background:var(--accent)}
.bar b{position:absolute;right:8px;top:0;line-height:16px;font-size:.74rem;font-weight:600;color:var(--fg)}
.legend{display:flex;gap:16px;font-size:.84rem;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:6px}

details{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
details summary{cursor:pointer;padding:14px 18px;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-family:var(--mono);color:var(--muted);font-size:1.1rem}
details[open] summary::after{content:"–"}
details .body{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px;font-size:.95rem}
details .body ul,.card ul{margin:0;padding-left:20px}
details .body li,.card li{margin:3px 0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:.86rem;box-shadow:var(--shadow);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

.footer-note{font-size:.82rem;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:16px}

@media (max-width: 860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:12px;padding-right:max(16px,env(safe-area-inset-right,0px));gap:10px;z-index:5}
  .brand .sub{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{white-space:nowrap;padding:7px 10px;font-size:.86rem}
  .nav .sep{display:none}
  .side .foot{display:none}
  .hero{grid-template-columns:1fr}
  .stage-head{grid-template-columns:1fr}
  .defl{grid-template-columns:1fr}
  .bar-row{grid-template-columns:1fr}
  .matrix{grid-template-columns:1fr}
  .main{padding-block:20px 48px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
<script>
const ZONES = [
  {id:'z1', name:'Установочно-прогностическая зона', short:'Установочно-прогностическая', stages:[1,2],
   text:'Вход преподавателя в форсайт-деятельность: переход от позиции потребителя образовательных услуг к позиции субъекта, осознанно включающегося в работу с профессиональным будущим. Реализует андрагогическое допущение о «потребности знать»: демонстрируется связь форсайт-деятельности с конкретными профессиональными задачами, диагностируются установки по отношению к будущему.'},
  {id:'z2', name:'Содержательно-форсайтинговая зона', short:'Содержательно-форсайтинговая', stages:[3,4],
   text:'Ядро форсайт-деятельности: восхождение от абстрактного к конкретному (В.В. Давыдов). Конструирование альтернативных сценариев развития предметной области и профессии (III этап) и перевод сценарных образов в индивидуальные и коллективные дорожные карты (IV этап). Преподаватель работает не с абстрактными прогнозами, а с проектными задачами собственной практики.'},
  {id:'z3', name:'Рефлексивно-интегрирующая зона', short:'Рефлексивно-интегрирующая', stages:[5,6],
   text:'Осмысление полученного опыта, трансформативная рефлексия профессиональных предпосылок (Дж. Мезироу) и интеграция результатов в систему ценностей и стратегий преподавателя. Завершение работы в зоне означает выход на новый виток спирали с обновлённым уровнем проспективной профессиональной субъектности.'}
];

const STAGES = [
 {n:1, roman:'I', name:'Проблематизация', zone:'z1', position:'Аналитик собственной практики',
  aim:'Диагностика исходных профессиональных установок по отношению к будущему и формирование мотивационной готовности к форсайт-деятельности.',
  content:['Самодиагностика установок: ретроспективной (воспроизводство сложившихся практик), адаптивной (приспособление к изменениям по мере их наступления), проспективной (предвосхищение изменений и конструирование будущего)','Выявление дефицитов форсайт-компетенции','Формулирование проблемы собственного профессионального развития в горизонте 5–15 лет','Построение персональной ресурсной карты: образовательные задачи, возможности, векторы движения'],
  requirement:'Деятельностное присвоение; андрагогическое допущение о «потребности знать»',
  basis:'С.Л. Рубинштейн — принцип единства сознания и деятельности: рефлексия собственных установок есть условие их трансформации',
  resources:'Диагностические', rgroup:1,
  modules:['Фасилитация — организация стартовой сессии','Цифровая навигация — обучение работе с диагностическими платформами'],
  steps:[['Онлайн-диагностика форсайт-компетенции на LMS-платформе','Moodle, iSpring'],['Получение индивидуального профиля в аналитической панели','панель образовательной аналитики LMS'],['Формулирование проблемы профессионального развития в цифровом рефлексивном дневнике','YoNote, Notion, дневник в LMS'],['Построение персональной ресурсной карты на совместной платформе','Miro, MURAL']],
  product:'Карта профессионального поля; профиль профессиональных дефицитов',
  assessment:'Рефлексивный отчёт по экспертной рубрике «Тип установки по отношению к будущему»; анкетная методика с трёхуровневой шкалой',
  applied:'Диагностика собственных задач, которые можно делегировать языковой модели (задание 1 модуля по генеративному ИИ)',
  tpl:'t1', prompts:[1,2]},
 {n:2, roman:'II', name:'Сканирование', zone:'z1', position:'Исследователь трендов',
  aim:'Горизонтальное сканирование: систематическое выявление восходящих трендов, слабых сигналов и системных противоречий, определяющих динамику изменений в высшем образовании.',
  content:['Идентификация технологических, социальных, экономических, демографических и культурных факторов, влияющих на предметную область и высшее образование','Анализ слабых сигналов — неочевидных, ещё не оформившихся тенденций','Выявление генетически исходных противоречий, порождающих наблюдаемые тренды','Переход от фиксации внешних проявлений изменений к пониманию их внутренней логики'],
  requirement:'Восхождение от абстрактного к конкретному',

const PROMPTS = [
 {id:1, stage:1, title:'Профиль профессиональных установок по отношению к будущему', text:`<b>Контекст.</b> Я преподаватель вуза, дисциплина — [дисциплина], стаж — [N] лет. Прохожу этап проблематизации форсайт-цикла и хочу увидеть собственные установки по отношению к будущему со стороны.
<b>Задание.</b> Ниже — мои ответы на вопросы о том, как я реагирую на изменения в образовании: [вставьте 5–7 ответов своими словами]. Определи, какая установка доминирует — ретроспективная (воспроизводство сложившихся практик), адаптивная (приспособление по мере наступления изменений) или проспективная (предвосхищение и конструирование будущего), — и покажи, на каких формулировках это видно.

<b>Требования.</b> Не давай оценок «хорошо/плохо». Не придумывай факты обо мне. Пиши по-русски, без общих рекомендаций.`},
 {id:2, stage:1, title:'Формулировка проблемы профессионального развития в горизонте 5–15 лет', text:`<b>Контекст.</b> Я преподаватель [дисциплина] в [тип вуза]. Основные задачи моей работы сейчас: [3–4 задачи]. Что меня беспокоит в перспективе: [2–3 тревоги или дефицита].
<b>Задание.</b> Помоги переформулировать мои тревоги в одну проблему профессионального развития, пригодную для форсайт-работы: противоречие между тем, что происходит в высшем образовании, и тем, как устроена моя практика. Предложи три варианта формулировки с горизонтом 5, 10 и 15 лет.
<b>Формат ответа.</b> Таблица: горизонт | формулировка проблемы (одно предложение вида «между … и …») | что мне нужно узнать, чтобы с ней работать.
<b>Требования.</b> Опирайся только на то, что я написал(а). Не предлагай готовых решений — только формулировки проблемы и вопросы.`},
 {id:3, stage:2, title:'Горизонтальное сканирование: факторы и слабые сигналы', text:`<b>Контекст.</b> Предметная область — [область], целевой горизонт — [5–10] лет. Я исследователь трендов на этапе сканирования и работаю с массивом текстов: [вставьте фрагменты аннотаций, новостей, документов или перечислите источники].
<b>Задание.</b> Выдели из этого массива технологические, социальные, экономические, демографические и культурные факторы, влияющие на мою область и на высшее образование. Отдельно отметь слабые сигналы — ещё не оформившиеся тенденции, упомянутые редко, но потенциально определяющие.
<b>Формат ответа.</b> Таблица: фактор | тип (Т/С/Э/Д/К) | свидетельство в тексте | тренд или слабый сигнал | на что влияет в моей дисциплине.

 {id:4, stage:2, title:'Выход на генетически исходное противоречие', text:`<b>Контекст.</b> По результатам сканирования я зафиксировал(а) следующие тренды и слабые сигналы в своей области: [список 6–10 позиций].
<b>Задание.</b> Помоги восходить от этих эмпирических трендов к их основаниям: какие системные противоречия порождают эту группу трендов? Проверь гипотезы вида «противоречие между нарастающей сложностью знания и когнитивными ресурсами индивидуального субъекта», «между конвергенцией технологий и дисциплинарной организацией знания», «между потребностью в персонализации и логикой массового образования» — и предложи свои, если они подходят лучше.
<b>Формат ответа.</b> Для каждого противоречия: формулировка | какие из моих трендов оно порождает | как оно проявится в моей дисциплине через 5–10 лет.
<b>Требования.</b> Не более трёх противоречий. Показывай связь каждого противоречия с конкретными трендами из моего списка; не вводи тренды, которых у меня нет.`},
 {id:5, stage:3, title:'Сценарные оси и четыре альтернативных сценария', text:`<b>Контекст.</b> Ключевые противоречия моей области: [2–3 противоречия]. Горизонт — [год]. Работаю в позиции сценариста-проектировщика; сценарии нужны для сценарной мастерской и последующего Дельфи-опроса.
<b>Задание.</b> Предложи две сценарные оси (два неопределённых фактора с полярными исходами) и опиши четыре сценария развития моей предметной области и профессии преподавателя в их пересечении — по образцу конфигураций «технологическая автоматизация», «гуманитарный ренессанс», «конвергентное развитие», «деглобализация», но с привязкой к моей области.
<b>Формат ответа.</b> Для каждого сценария: название | конфигурация осей | что происходит с содержанием дисциплины | что происходит с ролью преподавателя | ранний индикатор, по которому я пойму, что этот сценарий реализуется.
<b>Требования.</b> Сценарии должны быть действительно альтернативными, а не градациями одного. Не выбирай «правильный» сценарий — это задача Дельфи-панели.`},
 {id:6, stage:3, title:'Моделирование последствий сценарной развилки', text:`<b>Контекст.</b> Сценарий: [название и краткое описание]. Развилка: [событие или решение, которое может пойти двумя путями].
<b>Задание.</b> Смоделируй последствия обоих путей развилки для трёх субъектов — студента, преподавателя, университета — на горизонте 1 года, 3 и 5 лет.
<b>Формат ответа.</b> Две таблицы (по одной на путь): субъект | через 1 год | через 3 года | через 5 лет. После таблиц — три вопроса для обсуждения в сценарной мастерской.
<b>Требования.</b> Опирайся на причинно-следственные связи, а не на оценки желательности. Отмечай, где прогноз наименее надёжен.`},
 {id:7, stage:4, title:'Альтернативные конфигурации дорожной карты', text:`<b>Контекст.</b> Я стратег-картограф. Выбранный сценарий: [название]. Моя цель профессионального развития на 3–5 лет: [цель]. Исходное состояние: [компетенции, ресурсы, ограничения]. Горизонты карты: 1 год, 3 года, 5 лет.
<b>Задание.</b> Сгенерируй три альтернативные конфигурации дорожной карты: консервативную, ускоренную и ориентированную на новую роль. Для каждой зафиксируй ключевые точки перехода, ресурсы и условия перехода между точками.
<b>Формат ответа.</b> Три таблицы: горизонт | ключевая точка | что должно быть сделано | необходимые ресурсы | измеримый индикатор достижения.
<b>Требования.</b> Каждая ключевая точка должна быть проверяемой. Не предлагай одинаковых шагов во всех трёх конфигурациях — различия должны быть содержательными.`},
 {id:8, stage:4, title:'Проверка согласованности карты со сценарием', text:`<b>Контекст.</b> Ниже — моя дорожная карта: [вставьте таблицу горизонт | ключевая точка | ресурсы | индикатор]. Целевой сценарий: [описание].
<b>Задание.</b> Проверь согласованность карты со сценарием: какие ключевые точки работают на сценарий, какие нейтральны, какие ему противоречат. Проверь также реалистичность сроков и измеримость индикаторов.
<b>Формат ответа.</b> Таблица: ключевая точка | связь со сценарием (работает / нейтральна / противоречит) | комментарий | предложение по уточнению. В конце — три самых рискованных допущения карты.
<b>Требования.</b> Не переписывай карту целиком. Предлагай уточнения, а не замены целей.`},
 {id:9, stage:5, title:'Черновик экспертного заключения на дорожную карту коллеги', text:`<b>Контекст.</b> Я эксперт-коммуникатор на этапе коллегиальной экспертизы. Дорожная карта коллеги: [вставьте карту]. Критерии экспертизы: реалистичность, инновационность, антропологическая состоятельность (карта работает на развитие человека, а не только на показатели).
<b>Задание.</b> Подготовь черновик экспертного заключения по трём критериям с аргументами, привязанными к конкретным пунктам карты, и тремя вопросами автору.
<b>Формат ответа.</b> По каждому критерию: сильные стороны | ограничения | вопрос автору. Итог — одно предложение о главном условии реализуемости карты.
<b>Требования.</b> Это черновик для моей собственной экспертизы: я сравню его со своим суждением. Формулируй конструктивно, без оценок личности автора.`},
 {id:10, stage:5, title:'Согласование приоритетов после экспертной сессии', text:`<b>Контекст.</b> На экспертной сессии группа из [N] преподавателей обсудила дорожные карты. Позиции участников по приоритетам развития: [перечислите кратко, кто что считает приоритетом].
<b>Задание.</b> Помоги подготовить материал для согласования: выдели совпадающие приоритеты, точки расхождения и предложи формулировки консенсусных приоритетов, которые можно вынести на голосование во втором туре Дельфи.
<b>Формат ответа.</b> Три списка: совпадения | расхождения с указанием, чьи позиции расходятся | 3–5 формулировок для голосования.

 {id:11, stage:6, title:'Трёхуровневая рефлексия цикла', text:`<b>Контекст.</b> Я завершаю форсайт-цикл в позиции рефлексивного практика. Мои записи из рефлексивного дневника: [вставьте заметки по этапам].

<b>Формат ответа.</b> Три раздела по типам рефлексии: что уже есть в записях | чего не хватает | вопросы.
<b>Требования.</b> Не дописывай за меня содержание рефлексии. Отдели мои формулировки от своих вопросов.`},
 {id:12, stage:6, title:'Запрос на новый виток спирали', text:`<b>Контекст.</b> Итоги цикла: дорожная карта [краткое описание], основной вывод рефлексии [вывод], главное изменившееся допущение [допущение]. Сроки ближайших значимых событий: [аттестация, новый семестр, новая технология].
<b>Задание.</b> Помоги сформулировать запрос на новый виток форсайт-цикла: какую проблему развития я ставлю теперь, на каком уровне она отличается от исходной, какой этап цикла потребует наибольшего внимания и к какой дате я планирую вернуться к карте.
<b>Формат ответа.</b> Четыре строки: новая проблема | чем она отличается от исходной | критический этап нового витка и почему | дата и повод возвращения к карте.
<b>Требования.</b> Формулировки — мои, в первом лице. Никаких общих советов по саморазвитию.`},
 {id:13, stage:0, title:'Стилизация учебного фрагмента под три аудитории', text:`<b>Контекст.</b> Фрагмент моего курса (не более 150 слов): [вставьте текст]. Дисциплина — [дисциплина].
<b>Задание.</b> Преобразуй фрагмент трижды: а) объяснение для школьника 9 класса; б) объяснение для взрослого слушателя программы ДПО; в) краткое объяснение через одну метафору.
<b>Формат ответа.</b> Три подписанных варианта, затем таблица: аудитория | цель | что изменилось в структуре и лексике.
<b>Требования.</b> Сохраняй фактическую точность исходного фрагмента. Не добавляй сведений, которых в нём нет.`},
 {id:14, stage:0, title:'Кейс и три задания разного уровня', text:`<b>Контекст.</b> Тема моего курса: [тема]. Образовательный результат: [что студент должен уметь]. Формат курса: [очный / смешанный / дистанционный].
<b>Задание.</b> Сгенерируй обучающий кейс по теме и три практических задания к нему — базовое, продвинутое, творческое.
<b>Формат ответа.</b> Кейс (до 200 слов) | задание 1 с критерием выполнения | задание 2 с критерием | задание 3 с критерием.
<b>Требования.</b> Каждое задание должно проверять заявленный результат, а не пересказ кейса. Укажи, что в кейсе придумано и требует проверки преподавателем.`},
 {id:15, stage:0, title:'Инструмент оценки под заявленную цель', text:`<b>Контекст.</b> Цель обучения, которую нужно проверить: [цель]. Уровень студентов: [курс, направление].
<b>Задание.</b> Составь инструмент оценки: а) 5 тестовых заданий с одним верным вариантом; б) 2 ситуационных задания с открытым ответом; в) критерии оценки одного из ситуационных заданий по шкале 0–10.
<b>Формат ответа.</b> Тест с указанием верного варианта | два ситуационных задания | таблица критериев: критерий | 0–3 | 4–7 | 8–10.
<b>Требования.</b> Каждое задание должно быть согласовано с целью обучения; поясни одной фразой, какой аспект цели проверяет каждое задание.`}
];

const LECTURES = [
 {id:'l-gam', stage:4, title:'Геймификация курса как прикладная задача картирования', lead:'Геймификация в технологии — не декоративная надстройка, а способ проектирования курса по сценарию: образовательный результат → учебная стратегия → метод оценки → игровая механика. Осваивая её на материале собственного курса, преподаватель присваивает метод картирования.',
  sections:[
   ['Цели внедрения — в формате чек-листа','Формулируются 3–5 измеримых целей: повысить активность студентов в обсуждениях; довести долю выполнения финального проекта до 80 % и выше; снизить отток после первого теста; поднять удовлетворённость курсом до 4,5 из 5 по итогам опроса. Цель без индикатора не считается целью.'],
   ['Карта пути студента (Learning Journey Map)','Для 2–3 модулей курса фиксируются цели модуля, содержание и форматы, ожидаемые действия студента, способы оценки, мотивационные триггеры и формы поддержки. Фазы пути: ориентация, погружение, консолидация, вызов, трансформация, завершение. Карта пути — это дорожное картирование, применённое к курсу.'],
   ['Согласование результата, стратегии, оценки и механики','Образовательный результат «студент умеет формулировать цель и задачи проекта» → разбор кейсов и шаблоны → составление проектной карты → механика «Миссия стартапа». Результат «знает этапы проектного цикла» → интерактивный лонгрид → тест на последовательность → «Маршрут проекта» с чекпоинтами. Результат «умеет презентовать проект» → разбор примеров → защита проекта → «Инвесторский питч». Результат «выявляет риски» → работа с антиреференсами и риск-матрицами → задание на описание рисков → «Аварийный режим».'],
   ['Модели обучения и игровые формы','Бихевиоризм — «награда за серию» (пять выполненных заданий дают бонус). Конструктивизм — квест с выбором маршрута. Проблемное обучение — нарратив «чрезвычайная ситуация»: у группы 24 часа. Коннективизм — «экспедиция знаний»: обмен знаниями даёт очки и ресурсы. Обучение через опыт — симуляции и роли («вы консультант стартапа»). Когнитивное ученичество — «Гильдия мастеров»: новичок получает ранги рядом с экспертом.'],
   ['Оценка эмоциональной вовлечённости','Короткая форма из 3–4 вопросов после раздела: насколько интересным был раздел; какое задание оказалось полезным; что улучшить; одно слово о том, что чувствуете после завершения. Собирается через Яндекс Формы или Google Forms и читается вместе с аналитикой LMS.']]},
 {id:'l-narr', stage:3, title:'Нарративный дизайн курса', lead:'Нарратив консолидирует модули курса в единую смысловую рамку и даёт преподавателю опыт сценарирования: та же работа с ролью, сюжетной линией и развилками, которая на III этапе применяется к собственному профессиональному будущему.',
  sections:[
   ['Этап 1. Исследование аудитории и культурных кодов','Какие элементы массовой культуры близки студентам, какие архетипы и нарративы вызывают отклик. Выбор канона: «путешествие героя», детективное расследование, ролевая симуляция профессии, психогеография (курс как восхождение на гору).'],
   ['Этап 2. Генерация идей','Мозговой штурм и ассоциативный анализ; языковые модели для генерации сюжетов, героев, метафор; методология CRAFT; систематизация через mind map и card sorting. Не каждая программа требует фантазийного нарратива: «профессиональное становление специалиста», «проектная лаборатория», «цифровая экспедиция» часто работают лучше.'],
   ['Этап 3. Визуальные и сюжетные референсы','Визуальные базы (Pinterest, Behance, Dribbble) и медийные источники — кино, сериалы, игры, визуальные новеллы — как источник стилистических и нарративных решений, адаптируемых к дидактическому формату.'],
   ['Этап 4. Сборка концепта','Основная идея (путешествие, экспедиция, миссия, симуляция); роль обучающегося (исследователь, герой, агент изменений, архитектор); сюжетная линия (начало, препятствия, кульминация, развязка); визуальная реализация (комиксы, прототипы в Figma, карточки персонажей); связи с геймификацией (прогресс, бейджи, миссии, ветвления); место в карте пути студента.'],
   ['Этап 5. Реализация в среде','YoNote — архитектура курса и сценарное продвижение; Figma — визуальный нарратив; Яндекс Формы / Quizlet — интерактивные задания и система достижений. Пример: курс французского языка как иммерсивное проживание жизни персонажа, переехавшего во Францию: заселение, документы, культура; очки опыта, бейджи «Документальный эксперт», «Мастер гастрономии», прогресс-бар.']]},
 {id:'l-craft', stage:3, title:'Креативная методология CRAFT', lead:'CRAFT (Creative Algorithms, Frames & Tools) переводит проектирование курса из репродуктивной логики «лекция — семинар — зачёт» в сценарную. Ключевое понятие — идея-фрейм.',
  sections:[
   ['Базовый фрейм и идея-фрейм','Базовый фрейм — статус-кво, привычная логика взаимодействия. Идея-фрейм — переопределённый контекст, в который погружается студент и в котором ему предстоит действовать: роли, формы взаимодействия, конфликты, цели, механизмы мотивации, параметры деятельности.'],
   ['Эвристика аналогий','Учебный контекст соотносится с внешней системой — рестораном, космической станцией, театром, медиафабрикой, шпионской миссией, экономическим форумом. Аналогия задаёт «большую идею» курса, структурирующую модули, задания, обратную связь и визуальные решения.'],
   ['Пример: программа «Маркетинг»','Базовый фрейм: каналы продвижения, анализ аудитории, сегментация. Идея-фрейм: симуляция маркетингового отдела корпорации «Galactic Brand Bureau». Роль студента — бренд-менеджер, выводящий товары на инопланетные рынки; каждая планета — сегмент аудитории; драма — дедлайн директора и потеря финансирования при провале; польза — лучшие команды представляют работы экспертам индустрии.'],
   ['Сценарный компонент и связь с картой пути','Прописываются типовые активности и игровые элементы каждого этапа: «переговоры с трудным студентом», «цифровой учебный артефакт», «миссия для нового рекрута экспедиции», «анализ кейса через линзу персонажа». Нарративные фазы соотносятся с этапами прохождения программы, чтобы избежать «игры ради игры».']]},
 {id:'l-id', stage:4, title:'Модели педагогического дизайна: ADDIE, SAM, ASSURE, 4C/ID', lead:'Алгоритмические каркасы проектирования программ — прикладной инструментарий стратега-картографа при создании прототипов образовательных инноваций.',
  sections:[
   ['ADDIE','Analysis — Design — Development — Implementation — Evaluation. Системность и последовательность проектного цикла; подходит для предсказуемых и формализованных курсов.'],
   ['SAM','Successive Approximation Model — итеративность и гибкость: частая обратная связь и прототипирование. Выбирается, когда условия меняются быстрее, чем длится проектный цикл.'],
   ['ASSURE','Акцент на интеграции медиатехнологий и учёте индивидуальных характеристик обучающихся на каждом шаге проектирования.'],
   ['4C/ID — проектирование комплексного обучения','Четыре компонента и шаги: учебные задачи (проектирование задач, методов оценки деятельности, их последовательности); поддерживающая информация (её проектирование, анализ когнитивных стратегий и ментальных моделей); процедурная информация (проектирование операционной информации, анализ когнитивных правил и пререквизитов); частичная практика (отработка повторяющихся операций).'],
   ['Выбор модели','Учитываются временные и ресурсные ограничения: итерации SAM требуют частой обратной связи; ADDIE удобна для формализованных курсов. После проектирования — саморефлексия: что удалось, какие трудности при адаптации к предмету, что доработать, какой каркас выбрать для следующего курса.']]},
 {id:'l-ai', stage:2, title:'Генеративный ИИ в проектировочных задачах преподавателя', lead:'Сквозной модуль: языковые модели осваиваются как аналитический ресурс через прикладные задачи собственного курса — от диагностики делегируемых задач до сравнения ответа модели с собственной экспертизой.',
  sections:[
   ['Структура промпта','Контекст → Задание → Формат ответа → Требования. Контекст задаёт роль и исходные данные; задание — конкретную операцию; формат — вид результата (таблица, список, разделы); требования — ограничения: не домысливать, ссылаться на предоставленные данные, объём.'],
   ['Задание 1. Диагностика делегируемых задач','Из типовых задач проектирования (формулировка целей, составление заданий, адаптация содержания, генерация кейсов, оценочные инструменты) выбрать 3–4 актуальных и определить, какие можно делегировать модели и что это даёт: время, вариативность, адаптивность, индивидуализация.'],

  try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e){ fallback(); }

/* ---------- spiral ---------- */
function spiralSVG(size=520, compact=false){
  const cx=size/2, cy=size/2, th0=0.55*Math.PI, turns=2.35;
  const r = th => 30 + 26*(th-th0);
  const pt = th => [cx + r(th)*Math.cos(th), cy + r(th)*Math.sin(th)];
  const path = (a,b,step=0.05) => { let d=''; for(let t=a;t<=b+1e-9;t+=step){ const [x,y]=pt(Math.min(t,b)); d+=(d?'L':'M')+x.toFixed(1)+' '+y.toFixed(1); } return d; };
  const thMax = th0 + turns*Math.PI;
  const nodes = STAGES.map((s,i)=>({s, th: th0 + 0.42*Math.PI + i*0.37*Math.PI}));
  let out = `<svg class="sp" viewBox="0 0 ${size} ${size}" role="img" aria-label="Спиральная ситуационно-позиционная модель: шесть этапов форсайт-цикла">`;
  out += `<path d="${path(th0, thMax)}" fill="none" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>`;
  // zone segments
  [[0,1,'z1'],[2,3,'z2'],[4,5,'z3']].forEach(([a,b,z])=>{ out += `<path d="${path(nodes[a].th-0.12, nodes[b].th+0.12)}" fill="none" stroke="var(--${z})" stroke-width="5" stroke-linecap="round" opacity=".9"/>`; });
  // arrow at the end (new turn)
  const [ex,ey]=pt(thMax); const [px,py]=pt(thMax-0.08); const ang=Math.atan2(ey-py,ex-px);
  const ah = (a,l)=>[ex - l*Math.cos(ang+a), ey - l*Math.sin(ang+a)];
  const [a1x,a1y]=ah(0.5,14), [a2x,a2y]=ah(-0.5,14);
  out += `<path d="M${a1x.toFixed(1)} ${a1y.toFixed(1)}L${ex.toFixed(1)} ${ey.toFixed(1)}L${a2x.toFixed(1)} ${a2y.toFixed(1)}" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  if(!compact) out += `<text x="${(ex-10).toFixed(1)}" y="${(ey+26).toFixed(1)}" class="pos" text-anchor="end">новый виток спирали →</text>`;
  // center
  out += `<circle cx="${cx}" cy="${cy}" r="${compact?34:46}" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>`;
  out += `<text x="${cx}" y="${cy-(compact?4:8)}" text-anchor="middle" class="center-t">Проспективная</text><text x="${cx}" y="${cy+(compact?8:6)}" text-anchor="middle" class="center-t">субъектность</text>`;
  if(!compact) out += `<text x="${cx}" y="${cy+22}" text-anchor="middle" class="center-s">целевой ориентир</text>`;
  // nodes
  nodes.forEach(({s,th})=>{
    const [x,y]=pt(th); const z=s.zone; const R=compact?16:19;
    const ox=Math.cos(th), oy=Math.sin(th);
    const lx = x + ox*(R+10), ly = y + oy*(R+10);
    const anchor = ox > 0.3 ? 'start' : (ox < -0.3 ? 'end' : 'middle');
    const dy = oy > 0.5 ? 14 : (oy < -0.5 ? -4 : 4);
    out += `<g class="node" data-stage="${s.n}" tabindex="0" role="button" aria-label="${s.roman} этап — ${s.name}, позиция: ${s.position}">`;
    out += `<circle class="main" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${R}" fill="var(--${z})" stroke="var(--bg)" stroke-width="3"/>`;
    out += `<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" font-size="${compact?10:11}" font-weight="700" fill="#fff" font-family="var(--mono)">${s.roman}</text>`;
    if(!compact){
      out += `<text x="${lx.toFixed(1)}" y="${(ly+dy).toFixed(1)}" text-anchor="${anchor}" class="lbl">${s.name}</text>`;
      out += `<text x="${lx.toFixed(1)}" y="${(ly+dy+13).toFixed(1)}" text-anchor="${anchor}" class="pos">${s.position.toLowerCase()}</text>`;
    }
    out += `</g>`;
  });
  out += `</svg>`;
  return out;
}
function bindSpiral(root){

}

POST.cycle = root => {

  root.querySelectorAll('[data-tpl]').forEach(a=>a.addEventListener('click',()=>state.tpl=a.dataset.tpl));
  root.querySelectorAll('[data-pf]').forEach(a=>a.addEventListener('click',()=>state.pf=a.dataset.pf));
  root.querySelectorAll('[data-lf]').forEach(a=>a.addEventListener('click',()=>state.lf=a.dataset.lf));
  root.querySelectorAll('[data-rg]').forEach(a=>a.addEventListener('click',()=>state.rg=+a.dataset.rg));
  const s = stageOf(state.stage), items = stageItems(s);

function vDiag(){
  const levelsTbl = (k,title) => `<div class="card stack"><h4>${title}</h4><div class="scale"><div class="lvl-crit"><b>Критический</b><br>${LEVELS[k][0]}</div><div class="lvl-adm"><b>Допустимый</b><br>${LEVELS[k][1]}</div><div class="lvl-opt"><b>Оптимальный</b><br>${LEVELS[k][2]}</div></div></div>`;
  return `
  <div class="view-head"><div class="eyebrow">Самодиагностика · I этап</div><h1>Какая у меня установка по отношению к будущему?</h1>
  <p class="lead">Экспресс-проверка для входа в цикл. Полный диагностический комплекс программы включает анкеты с трёхуровневой шкалой, опросник профессиональной мотивации, экспертные рубрики проектных продуктов и рефлексивные карты; здесь — ориентировочная самооценка, результат которой не передаётся никуда.</p></div>

  <section class="card">
    <form id="diag">
      ${DIAG_Q.map((q,i)=>`<div class="q"><b>${i+1}. ${q.q}</b><div class="opts">${q.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" id="q${i}-${j}" value="${j}"><span>${o}</span></label>`).join('')}</div></div>`).join('')}
      <div class="row" style="margin-top:14px"><button class="btn primary" type="submit">Показать результат</button><button class="btn" type="button" id="diag-reset">Сбросить</button></div>
    </form>
    <div id="diag-res" class="stack" style="margin-top:16px" hidden></div>
  </section>

  <div class="view-head"><div class="eyebrow">Калькулятор уровня</div><h2>Интегральный показатель S<sub>инт</sub></h2>
  <p>Экспертное оценивание по десятибалльной шкале: 8–10 баллов — оптимальный уровень, 5–7 — допустимый, 4 и менее — критический. <span class="mono">S<sub>инт</sub> = (S<sub>мц</sub> + S<sub>кп</sub> + S<sub>од</sub>) / 3</span>. Оцените себя по каждому компоненту или внесите оценки эксперта.</p></div>
  <section class="card stack">
    <div class="grid g3">
      ${[['mc','S<sub>мц</sub> — мотивационно-ценностный'],['kp','S<sub>кп</sub> — когнитивно-прогностический'],['od','S<sub>од</sub> — операционально-деятельностный']].map(([k,l])=>`<label class="f">${l} <span class="num" id="v-${k}">6</span><input type="range" min="1" max="10" value="6" id="r-${k}"></label>`).join('')}
    </div>
    <div class="result" id="s-res"></div>
  </section>
  <section class="stack">
    <div class="eyebrow">Критерии уровней по компонентам</div>
    ${levelsTbl('mc','Мотивационно-ценностный компонент')}${levelsTbl('kp','Когнитивно-прогностический компонент')}${levelsTbl('od','Операционально-деятельностный компонент')}
  </section>`;
}
POST.diagnostics = root => {
  const f=$('#diag',root), res=$('#diag-res',root);
  f.addEventListener('submit',e=>{
    e.preventDefault();
    const cnt=[0,0,0]; let answered=0;
    DIAG_Q.forEach((q,i)=>{ const v=f.querySelector(`input[name=q${i}]:checked`); if(v){ cnt[+v.value]++; answered++; } });
    if(answered<DIAG_Q.length){ res.hidden=false; res.innerHTML=`<div class="result">Ответьте на все ${DIAG_Q.length} утверждений — пропущено ${DIAG_Q.length-answered}.</div>`; return; }
    const names=['ретроспективная','адаптивная','проспективная'];
    const desc=['Ориентация на воспроизводство сложившихся практик. В технологии это исходная точка, а не приговор: I этап построен так, чтобы показать связь форсайт-деятельности с вашими конкретными задачами, а прикладная задача («научиться применять нейросети в курсе», «спроектировать геймификацию») становится входом в цикл.','Готовность приспосабливаться к изменениям по мере их наступления — переходный тип с элементами проспективной ориентации. Критическая точка роста — II и III этапы: переход от отслеживания трендов к пониманию порождающих их противоречий и к конструированию альтернатив.','Способность предвосхищать изменения и конструировать профессиональное будущее. Технология нужна здесь для технологической полноты цикла: оформить интуицию в сценарную матрицу и дорожную карту, пройти экспертизу коллег и зафиксировать, какие допущения вы пересмотрели.'];
    const max=Math.max(...cnt); const dom=cnt.indexOf(max); const tie=cnt.filter(c=>c===max).length>1;
    res.hidden=false;
    res.innerHTML=`<div class="result"><div class="eyebrow">Доминирующая установка</div><h3 style="margin:4px 0 8px">${tie?'Смешанный профиль':names[dom].charAt(0).toUpperCase()+names[dom].slice(1)}</h3><p class="small">Ретроспективная: ${cnt[0]} · адаптивная: ${cnt[1]} · проспективная: ${cnt[2]} из ${DIAG_Q.length}</p></div><p>${tie?'Ответы распределились между установками почти поровну: это типичная переходная картина. Начните с I этапа — формулировка проблемы развития в горизонте 5–15 лет покажет, какая линия ведущая.':desc[dom]}</p><div class="row"><a class="btn primary" href="#cycle">Перейти к I этапу</a><a class="btn" href="#templates">Персональная ресурсная карта</a></div>`;
    try{ res.scrollIntoView({behavior:'smooth',block:'nearest'}); }catch(e){}
  });
  $('#diag-reset',root).addEventListener('click',()=>{ f.reset(); res.hidden=true; });
  const calc=()=>{
    const v={}; ['mc','kp','od'].forEach(k=>{ v[k]=+$('#r-'+k,root).value; $('#v-'+k,root).textContent=v[k]; });
    const s=(v.mc+v.kp+v.od)/3; const lvl = s>=8?2:(s>=5?1:0); const ln=['критический','допустимый','оптимальный'];
    const comp=k=>{ const x=v[k]; const l=x>=8?2:(x>=5?1:0); return ln[l]; };
    $('#s-res',root).innerHTML=`<div class="eyebrow">S<sub>инт</sub> = (${v.mc} + ${v.kp} + ${v.od}) / 3</div><h3 style="margin:4px 0 6px" class="num">${s.toFixed(2)} — ${ln[lvl]} уровень</h3><p class="small">По компонентам: мотивационно-ценностный — ${comp('mc')}; когнитивно-прогностический — ${comp('kp')}; операционально-деятельностный — ${comp('od')}.</p>`;
  };
  ['mc','kp','od'].forEach(k=>$('#r-'+k,root).addEventListener('input',calc)); calc();
};

function vTpl(){

  const field = ([id,label,hint,kind]) => `<label class="f">${label}${hint?`<span class="hint">${hint}</span>`:''}${kind==='in'?`<input type="text" id="tf-${t.id}-${id}" data-f="${id}" value="${esc(saved[id]||'')}">`:`<textarea id="tf-${t.id}-${id}" data-f="${id}">${esc(saved[id]||'')}</textarea>`}</label>`;
  let body;
  if(t.matrix){
    const fs = Object.fromEntries(t.fields.map(f=>[f[0],f]));
    body = `<div class="grid g2">${field(fs.axisA)}${field(fs.axisB)}</div><div class="matrix">${['q1','q2','q3','q4'].map(q=>`<div class="quad"><div class="qt">${fs[q][1]}</div><textarea id="tf-${t.id}-${q}" data-f="${q}" placeholder="${esc(fs[q][2])}">${esc(saved[q]||'')}</textarea></div>`).join('')}</div>${field(fs.delphi)}`;
  } else body = t.fields.map(field).join('');
  return `

    <div class="row between"><div><span class="pill ${s.zone}">этап ${s.roman} — ${s.position}</span></div><span class="small muted" id="tpl-status">${Object.keys(saved).length?'Сохранено в этом браузере':''}</span></div>
